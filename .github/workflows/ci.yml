name: Archetype CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  contract-suite:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - fast
          - contracts
          - release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.59.1-${{ runner.os }}

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx --yes playwright@1.59.1 install --with-deps chromium

      - name: Run contract suite
        env:
          ARCHETYPE_TARGET_NPM_CACHE_DIR: ${{ runner.temp }}/archetype-target-npm-cache
        run: npm run check:${{ matrix.suite }}

      - name: Upload timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-suite-${{ matrix.suite }}-timings
          path: tmp/contract-suite/${{ matrix.suite }}-timings.*
